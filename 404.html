<script>
  // Former project-copy URLs: site metadata moved beside each project page; everything else lives in the project repository.
  (function () {
    var moved = {
      '/casuallab/project.yaml': '/projects/casuallab/project.yaml',
      '/macroeconomics/project.yaml': '/projects/macroeconomics/project.yaml',
      '/realestate/project.yaml': '/projects/realestate/project.yaml',
      '/tariff-incidence/project.yaml': '/projects/tariff-incidence/project.yaml',
      '/microstructure/project.yaml': '/projects/microstructure/project.yaml',
      '/em-factor-timing/project.yaml': '/projects/em-factor-timing/project.yaml',
      '/polymarket-factors/project.yaml': '/projects/polymarket-factors/project.yaml',
      '/crypto-factors/project.yaml': '/projects/crypto-factors/project.yaml',
      '/microstructure/docs/PUBLICATION.md': '/projects/microstructure/PUBLICATION.md',
      '/microstructure/docs/DATA_POLICY.md': '/projects/microstructure/DATA_POLICY.md'
    };
    var path = location.pathname;
    if (moved[path]) { location.replace(moved[path]); return; }
    var match = path.match(/^\/(casuallab|macroeconomics|realestate|tariff-incidence|microstructure|em-factor-timing|polymarket-factors|crypto-factors)(?:\/(.*))?$/);
    if (!match) return;
    var rest = (match[2] || '').replace(/\/$/, '');
    var repo = 'https://github.com/YangXiaoShawn/open-economic-quant-' + match[1];
    location.replace(rest ? repo + '/blob/main/' + rest : repo);
  })();
</script>
