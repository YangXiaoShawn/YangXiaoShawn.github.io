name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -r apps/space/requirements.txt
      - run: python scripts/build_site_data.py --check
      - run: python scripts/validate_projects.py
      - run: python scripts/verify_deployment.py
      - run: python -m compileall scripts apps/space/app.py
      - run: pytest -q apps/space/tests
      - name: Secret marker scan
        run: '! git grep -En "ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY"'
