[project]
name = "tariff-incidence"
version = "0.1.0"
description = "Tariff Incidence, Supply-Chain Reallocation, and Domestic Propagation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "linearmodels>=6.1",
    "pypdf>=5.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",   # Census publishes concordances through 2019 as legacy .xls
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]
dash = ["streamlit>=1.40", "altair>=5.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_incidence"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E501  line length is handled by the formatter
# N803/N806 econometric code uses conventional capitals (X, D, V) for matrices
# UP042 str+Enum is deliberate: these enums are serialised to JSON and Parquet
#       and must compare equal to their string values on read-back
# N818  SourceUnavailable / UnsupportedClaim read better without an Error suffix
#       and are part of the public API
# B007  loop variables used after the loop (iteration counters)
# SIM102 nested conditions kept separate where each carries its own comment
ignore = ["E501", "N803", "N806", "UP042", "N818", "B007", "SIM102"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/tariff_incidence/tariff", "src/tariff_incidence/concordance", "src/tariff_incidence/adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access to an official data source",
    "slow: long-running test",
]
