last_updated: 2026-09-30
limitations: Backtest and post-publication out-of-sample backtest association, not live trading. Next-close fills omit market impact; about five names per leg in the large-coin pool; the 2024-2026 sample is an altcoin bear market; OKX funding history via ccxt is approximately three months.
