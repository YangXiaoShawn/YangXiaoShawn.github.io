limitations: Evidence is out-of-sample predictive comparison, not causal identification. Factor returns are gross of their own stock-level rebalancing costs and signed by the original studies, so Sharpe levels must be read comparatively. Results depend on factor weighting (equal-weighted factors show positive R2_OS vs shrinkage mean, whereas capped value-weighted factors do not).
