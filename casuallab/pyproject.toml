[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "causal-marketplace-lab"
version = "0.1.0"
description = "Reproducible marketplace experiment design, interference simulation, and policy learning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Causal Marketplace Lab"}]
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15",
  "pyshp>=2.3",
  "PyYAML>=6.0",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "shapely>=2.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dashboard = [
  "altair>=5.3",
  "streamlit>=1.36",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
casuallab = "casuallab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/casuallab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
