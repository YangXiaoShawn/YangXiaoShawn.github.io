benchmark:
  # Laptop-safe default. Monte Carlo standard errors are reported with every metric.
  # Eleven common-seed sensitivity cells remain laptop-safe at this count, including
  # rider-only and driver-only intervention-version checks. Exact
  # common-random-number pairing applies when geometry is equal; the G=8 cell changes
  # panel shape. Every reported Monte Carlo metric includes its simulation standard error.
  replications: 24
  seed: 314159
  confidence_level: 0.95
  designs:
    - individual
    - geo_cluster
    - time_block
    - switchback
    - geo_time
  estimators:
    - difference_in_means
    - regression_adjusted
    - cluster_robust
    - two_way_cluster_robust
    - difference_in_differences
    - doubly_robust
  target_estimand: market_total_effect
  cost_per_market_period: 1.0
