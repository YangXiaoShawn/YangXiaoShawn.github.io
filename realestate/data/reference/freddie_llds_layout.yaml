zero_balance_codes:
- code: '15'
  official_label: Whole Loan Sale
  priority: 1
  event_class: admin_removal
  treated_as_censoring: true
  rationale: Freddie Mac portfolio action. Not a borrower decision. Censored.
- code: '16'
  official_label: Reperforming loan securitizations
  priority: 2
  event_class: admin_removal
  treated_as_censoring: true
  rationale: Freddie Mac portfolio action (RPL securitization). Not a borrower decision. Censored.
- code: 09
  official_label: REO Disposition
  priority: 3
  event_class: credit_event
  treated_as_censoring: false
  rationale: Terminal credit outcome following foreclosure.
- code: '96'
  official_label: Defect prior to other termination event
  priority: 4
  event_class: admin_removal
  treated_as_censoring: true
  rationale: Repurchase / indemnification / make-whole arising from a representation and warranty defect.
    Not a borrower decision. Censored.
- code: '03'
  official_label: Short Sale or Charge Off
  priority: 5
  event_class: credit_event
  treated_as_censoring: false
  rationale: Terminal credit outcome.
- code: '02'
  official_label: Third Party Sale
  priority: 6
  event_class: credit_event
  treated_as_censoring: false
  rationale: Sale to a third party at foreclosure auction. A CREDIT outcome, not a voluntary household
    move.
- code: '01'
  official_label: Prepaid or Matured (Voluntary Payoff)
  priority: 7
  event_class: prepayment
  treated_as_censoring: false
  rationale: CONFLATES voluntary payoff and scheduled maturity, and does NOT distinguish refinance from
    sale-related payoff. This is the single most important limitation of the loan-level design.
